<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Crea un Account</mat-card-title>
    </mat-card-header>

    <form (ngSubmit)="onRegister()" #regForm="ngForm">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome Completo</mat-label>
          <input matInput [(ngModel)]="registerData.name" name="name" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="registerData.email" name="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="registerData.password" name="password" required minlength="6">
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="accent" type="submit" [disabled]="!regForm.valid" class="full-width">
          Registrati
        </button>
      </mat-card-actions>

      <div class="auth-footer">
        Hai già un account? <a routerLink="/login">Accedi qui</a>
      </div>
    </form>
  </mat-card>
</div>
